name: Update Forecast

on:
  schedule:
    # 12:00 UTC = 7:00 AM Central Daylight Time (summer/fall)
    # 6:00 AM Central Standard Time (winter) — the hour will drift
    # by one during standard time; edit if that matters to you.
    - cron: "0 12 * * 6"   # every Saturday
  workflow_dispatch: {}     # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pull fresh forecast
        run: python update_forecast.py

      - name: Commit updated forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          git diff --quiet --cached || git commit -m "Weekly forecast refresh"
          git push
